<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found — GRCALL</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        background: #fdfbf7;
        color: #000;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 40rem;
        padding: 2rem;
        background: #fff;
        border: 4px solid #000;
        border-radius: 1.25rem;
        box-shadow: 8px 8px 0 0 #000;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1.25rem;
        font-weight: 900;
        font-size: 0.8rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .brand span {
        display: inline-grid;
        place-items: center;
        width: 1.75rem;
        height: 1.75rem;
        border: 3px solid #000;
        border-radius: 0.45rem;
        background: #ffdc58;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 6vw, 3rem);
        line-height: 1.05;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        max-width: 34rem;
        font-size: 1.05rem;
        line-height: 1.6;
        font-weight: 500;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1.75rem;
      }
      a {
        display: inline-block;
        padding: 0.8rem 1.15rem;
        border: 3px solid #000;
        border-radius: 0.75rem;
        font-size: 0.8rem;
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-decoration: none;
        color: #000;
        background: #ffdc58;
      }
      a.secondary {
        background: #fff;
      }
      a:focus-visible {
        outline: 4px solid #2dd4bf;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="brand"><span aria-hidden="true">◎</span> GRCALL</p>
      <h1>Page not found</h1>
      <p>
        This address does not match a page in the shell or a training with a built bundle. It may
        have moved, or the training may not have been built in this deployment.
      </p>
      <nav class="actions" aria-label="Ways back">
        <a href="/GRCALL-demo/">Home</a>
        <a class="secondary" href="/GRCALL-demo/trainings">All trainings</a>
      </nav>
    </main>
  </body>
</html>
